# SonicWave CI — runs on every push and PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit & smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     sonicwave
          POSTGRES_PASSWORD: sonicwave
          POSTGRES_DB:       sonicwave_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sonicwave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sonicwave:sonicwave@localhost:5432/sonicwave_test
      REDIS_URL:    redis://localhost:6379
      NODE_ENV:     test
      # Stripe and Firebase tokens are not needed for unit/smoke tests;
      # integration tests that need them should use secrets.
      STRIPE_SECRET_KEY:      sk_test_placeholder
      STRIPE_WEBHOOK_SECRET:  whsec_placeholder
      FIREBASE_PROJECT_ID:    test-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run migrate
      - name: Run tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify output
        run: test -f dist/server.cjs && echo "dist/server.cjs exists"
