# render.yaml — SonicWave deployment on Render.com
# Commit this file to the PapiSlimm/SonicWave repo as render.yaml (replace the old one).
# Fixes vs the previous file: Postgres plan "starter" is legacy → "0.1c-256mb"; Redis is not a database —
# it is a service of type keyvalue (Render Key Value) with a required ipAllowList.

services:
  - type: web
    name: sonicwave
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    branch: main
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the app reads process.env.PORT
      - key: DATABASE_URL
        fromDatabase:
          name: sonicwave-pg
          property: connectionString
      - key: REDIS_URL
        sync: false  # set manually in Render dashboard — reuse your existing free Key Value
      # Set these in the Render dashboard (never commit real keys)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: gen-lang-client-0237733980
      - key: STORAGE_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: MIGRATE_SECRET
        sync: false

  # Key Value service removed — account already has 1 free Key Value instance (Render limit).
  # Set REDIS_URL manually in the Render dashboard env vars.

databases:
  - name: sonicwave-pg
    region: oregon
    plan: 0.1c-256mb      # smallest paid non-legacy plan; "free" expires after 30 days
    databaseName: sonicwave
    user: sonicwave
